name: Build Libs

on:
  workflow_dispatch:

env:
  SDL_VERSION: release-3.4.12

jobs:
  Build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            lib: SDL3.dll
          - os: macos-latest
            target: osx
            lib: libSDL3.dylib
          - os: ubuntu-latest
            target: linux-x64
            lib: libSDL3.so
          - os: ubuntu-22.04-arm
            target: linux-arm64
            lib: libSDL3.so
          - os: ubuntu-22.04-arm
            target: linux-arm
            lib: libSDL3.so
            container: arm32v7/ubuntu:jammy
    runs-on: ${{matrix.os}}
    container: ${{matrix.container}}
    steps:
      - name: Setup ARM32 Container Pre-Depends
        if: ${{ matrix.target == 'linux-arm' }}
        run: |
          # add arm64 architecture for arm64 nodeJS for actions/upload-artifact inherited from the host
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y sudo git libc6:arm64 libstdc++6:arm64

      - name: Checkout SDL3
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/sdl
          ref: ${{ env.SDL_VERSION }}
          path: sdl3-src
          
      - name: Setup macOS universal build
        if: ${{ runner.os == 'macOS' }}
        run: echo "CMAKE_EXTRA_ARGS=-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" >> $GITHUB_ENV

      - name: Setup Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Build SDL3
        shell: bash
        run: |
          cmake -B build -S sdl3-src \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            $CMAKE_EXTRA_ARGS
          cmake --build build --config Release

      - name: Collect Artifact
        shell: bash
        run: find build -name "${{matrix.lib}}" -exec cp {} . \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.target}}
          path: ${{matrix.lib}}
  UpdateLibs:
    if: github.ref == 'refs/heads/main'
    needs: [Build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download libs
        uses: actions/download-artifact@v8
        with:
          path: Framework/Internal/Native

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

           git add Framework/Internal/Native

           if git diff --cached --quiet; then
             echo "no changes to commit"
          else
            git commit -m "Updated native libs"
            git push
          fi     